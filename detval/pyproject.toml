[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "detval"
dynamic = ["version"]
description = "Continuous detection validation: run ATT&CK techniques and confirm your SIEM detects them, with ground-truth scoring and an ATT&CK Navigator coverage layer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "IB" }]
keywords = ["splunk", "siem", "detection-engineering", "detection-engineering", "purple-team", "atomic-red-team", "mitre-attack", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
detval = "detval.cli:main"

[project.urls]
Homepage = "https://github.com/idanbuller/DetectionEngineering/tree/main/detval"

[tool.setuptools.dynamic]
version = { attr = "detval.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for Python 3.9
