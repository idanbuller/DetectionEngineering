[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma2splunk"
dynamic = ["version"]
description = "Convert Sigma detection rules to Splunk SPL and detection-as-code, mapped to your indexes and filtered to the data you actually collect."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "IB" }]
keywords = ["splunk", "siem", "detection-engineering", "sigma", "splunk", "spl", "detection-engineering", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=5.4", "spl-lint>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sigma2splunk = "sigma2splunk.cli:main"

[project.urls]
Homepage = "https://github.com/idanbuller/DetectionEngineering/tree/main/sigma2splunk"

[tool.setuptools.dynamic]
version = { attr = "sigma2splunk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for Python 3.9
