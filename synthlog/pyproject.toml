[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthlog"
dynamic = ["version"]
description = "Synthetic security logs with injected attack scenarios and ground truth, for testing detections."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "IB" }]
keywords = ["splunk", "siem", "detection-engineering", "synthetic-data", "security", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
synthlog = "synthlog.cli:main"

[project.urls]
Homepage = "https://github.com/idanbuller/DetectionEngineering/tree/main/synthlog"

[tool.setuptools.dynamic]
version = { attr = "synthlog.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for Python 3.9
