[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "detsim"
dynamic = ["version"]
description = "Generate a hit for each detection: synthesize an event that trips it, or a guide (with the matching Atomic Red Team test) for ones that need real simulation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "IB" }]
keywords = ["splunk", "siem", "detection-engineering", "detection-engineering", "atomic-red-team", "purple-team", "splunk", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=5.4", "spl-lint>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
detsim = "detsim.cli:main"

[project.urls]
Homepage = "https://github.com/idanbuller/DetectionEngineering/tree/main/detsim"

[tool.setuptools.dynamic]
version = { attr = "detsim.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for Python 3.9
