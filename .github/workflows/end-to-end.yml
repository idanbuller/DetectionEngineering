name: end-to-end

on:
  push:
    branches: [main]
    paths:
      - "examples/end-to-end/**"
      - "*/src/**"
      - ".github/workflows/end-to-end.yml"
  pull_request:
    paths:
      - "examples/end-to-end/**"
      - "*/src/**"
      - ".github/workflows/end-to-end.yml"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./spl-lint ./synthlog ./spltest ./detval ./detcov ./sigma2splunk
      - name: Run the end-to-end example (offline)
        run: examples/end-to-end/run.sh
      - name: The example produced a coverage layer
        run: python -c "import json; t=json.load(open('examples/end-to-end/build/coverage.json'))['techniques']; assert {x['techniqueID'] for x in t} >= {'T1059.002','T1543.001'}, t"
