name: spl-lint

on:
  push:
    branches: [main]
    paths: ["spl-lint/**", ".github/workflows/spl-lint.yml"]
  pull_request:
    paths: ["spl-lint/**", ".github/workflows/spl-lint.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: spl-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" ruff
      - run: ruff check src tests && ruff format --check src tests
      - run: pytest -q
      - name: Buggy examples must fail with exit code 1
        run: |
          code=0; spl-lint examples/buggy || code=$?
          test "$code" -eq 1
      - name: Clean examples must pass
        run: spl-lint examples/clean

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action against the clean examples
        uses: ./spl-lint
        with:
          paths: spl-lint/examples/clean
