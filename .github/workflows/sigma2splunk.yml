name: sigma2splunk

on:
  push:
    branches: [main]
    paths: ["sigma2splunk/**", "spl-lint/**", ".github/workflows/sigma2splunk.yml"]
  pull_request:
    paths: ["sigma2splunk/**", "spl-lint/**", ".github/workflows/sigma2splunk.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./spl-lint "./sigma2splunk[dev]" ruff
      - working-directory: sigma2splunk
        run: ruff check src tests && ruff format --check src tests
      - working-directory: sigma2splunk
        run: pytest -q
      - name: Example rules convert and the output lints clean
        working-directory: sigma2splunk
        run: |
          sigma2splunk convert examples/sigma -o /tmp/detections
          spl-lint --no-config --fail-on warning /tmp/detections
