name: detval

on:
  push:
    branches: [main]
    paths: ["detval/**", ".github/workflows/detval.yml"]
  pull_request:
    paths: ["detval/**", ".github/workflows/detval.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: detval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" ruff
      - run: ruff check src tests && ruff format --check src tests
      - run: pytest -q
      - name: Cases list, and verify never executes
        env:
          # a dummy token so the Splunk client builds; the URL is unreachable, so every
          # check errors on the search, but nothing is ever executed by `verify`.
          SPLUNK_TOKEN: ci-dummy-token
        run: |
          detval list examples/cases
          detval verify examples/cases --splunk-url http://127.0.0.1:9 -f json > out.json || true
          python -c "import json; d=json.load(open('out.json')); assert d and all(c['execution']['status']=='skipped' for c in d), d"
