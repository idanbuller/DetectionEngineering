name: catalog

on:
  push:
    branches: [main]
    paths: ["detections/**", "spl-lint/**", "sigma2splunk/**", "detcov/**", ".github/workflows/catalog.yml"]
  pull_request:
    paths: ["detections/**", "spl-lint/**", "sigma2splunk/**", "detcov/**", ".github/workflows/catalog.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./spl-lint ./detcov
      - name: The catalog lints clean
        run: spl-lint --fail-on warning detections/library
      - name: detcov can build coverage from the catalog
        run: detcov report detections/library -f json > /tmp/cov.json && python -c "import json; assert json.load(open('/tmp/cov.json'))"
