name: detsim

on:
  push:
    branches: [main]
    paths: ["detsim/**", "spl-lint/**", "detections/**", ".github/workflows/detsim.yml"]
  pull_request:
    paths: ["detsim/**", "spl-lint/**", "detections/**", ".github/workflows/detsim.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./spl-lint "./detsim[dev]" ruff
      - working-directory: detsim
        run: ruff check src tests && ruff format --check src tests
      - working-directory: detsim
        run: pytest -q
      - name: Every catalog detection gets a hit
        run: detsim simulate detections/library --fail-on-manual
