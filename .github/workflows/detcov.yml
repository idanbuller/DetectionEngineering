name: detcov

on:
  push:
    branches: [main]
    paths: ["detcov/**", "spl-lint/**", ".github/workflows/detcov.yml"]
  pull_request:
    paths: ["detcov/**", "spl-lint/**", ".github/workflows/detcov.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./spl-lint "./detcov[dev]" ruff
      - working-directory: detcov
        run: ruff check src tests && ruff format --check src tests
      - working-directory: detcov
        run: pytest -q
      - name: Example coverage report builds
        working-directory: detcov
        run: |
          detcov report examples/detections --health examples/health.json --detval examples/detval-results.json --layer /tmp/layer.json
          python -c "import json; assert json.load(open('/tmp/layer.json'))['techniques']"
